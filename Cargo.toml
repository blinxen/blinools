[package]
name = "blinools"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
garde = { version = "0.23.0", features = ["derive"] }
gix = { version = "0.86.0", default-features = false, features = ["sha1", "worktree-mutation", "index"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
