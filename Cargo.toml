[package]
name = "blinools"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
garde = { version = "0.23", features = ["derive"] }
imago = { version = "0.2", default-features = false, features = ["sync"] }
libc = "0.2"
rand = { version = "0.10.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["derive"] }
unicode-general-category = { version = "1.1.0", default-features = false }
vte = { version = "0.15", default-features = false }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
