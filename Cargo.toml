[package]
name = "blinools"
license = "GPL-3.0-or-later"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"

[features]
man = ["dep:clap_mangen", "dep:jiff"]

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = "3"
clap_complete = { version = "4", features = ["unstable-dynamic"] }
clap_mangen = { version = "0.3", optional = true }
jiff = { version = "0.2", optional = true, default-features = false, features = ["std"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
env_logger = "0.11"
garde = { version = "0.23", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["worktree-mutation", "sha1", "auto-chain-error"] }
imago = { version = "0.2", default-features = false, features = ["sync"] }
libc = "0.2"
log = { version = "0.4", default-features = false }
nftables = "0.6"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["derive"] }
unicode-general-category = { version = "1", default-features = false }
vte = { version = "0.15", default-features = false }
walkdir = "2.5"
ipnet = { version = "2.12.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
serial_test = "4"
