[package]
name = "blinools"
license = "GPL-3.0-or-later"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = "3"
clap_complete = { version = "4", features = ["unstable-dynamic"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
env_logger = "0.11"
garde = { version = "0.23", features = ["derive"] }
imago = { version = "0.2", default-features = false, features = ["sync"] }
libc = "0.2"
log = { version = "0.4", default-features = false }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["derive"] }
unicode-general-category = { version = "1", default-features = false }
vte = { version = "0.15", default-features = false }
wait-timeout = "0.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
