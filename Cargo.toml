[package]
name = "blinools"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
config = { version = "0.15", default-features = false, features = ["toml"] }
garde = { version = "0.23", features = ["derive"] }
gix = { version = "0.86", default-features = false, features = ["sha1", "worktree-mutation", "index"] }
imago = { version = "0.2", default-features = false, features = ["sync"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.21", default-features = false, features = ["derive"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
